# Disposable services for the Playwright E2E tests. `pnpm test:e2e` starts them (and CI uses the same file).
# Own project, own ports and no volumes: nothing is shared with the development stack in compose.yml, and
# `pnpm e2e:down` throws everything away. Each spec still makes and drops its own schema and bucket.
name: helvetly-e2e

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: helvetly
      POSTGRES_PASSWORD: helvetly
      POSTGRES_DB: helvetly
    ports:
      - '127.0.0.1:5434:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helvetly -d helvetly']
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: maxiofs/maxiofs:1.8.0
    environment:
      MAXIOFS_BOOTSTRAP_ACCESS_KEY: helvetly
      MAXIOFS_BOOTSTRAP_SECRET_KEY: helvetly-secret
    ports:
      - '127.0.0.1:9310:8080' # S3 API
    tmpfs:
      - /data
