name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

# A newer commit supersedes a PR's run. Every other run (push to main, merge group, manual) has a
# group of its own: never cancelled, and never dropped as a superseded pending run either.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The full local gate remains `pnpm check`. PR selection and the required aggregate are documented
# in the maintainers' CI notes. ready_for_review, merge groups and manual runs always select the full suite; a push to
# main is scoped against the previous main commit only when that commit's CI run passed.

env:
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # did the previous main commit's run pass (scripts/ci.mjs pushRunPassed)
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      e2e: ${{ steps.select.outputs.e2e }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # history for the diff, no file contents
          persist-credentials: false
      - id: select
        run: node scripts/ci.mjs select
        env:
          GITHUB_TOKEN: ${{ github.token }}

  quick:
    name: Quick checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1; pnpm's version comes from `packageManager`
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache: false
      # PRs restore the Go cache but never save it: saving a cache per commit cost upload time on
      # every job and evicted main's caches. Main, merge groups and manual runs save it.
      - if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &go-cache-config
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('apps/api/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('apps/api/go.sum') }}-
      - if: needs.changes.outputs.backend == 'true' && github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *go-cache-config
      - &install
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec oxlint --deny-warnings
      - if: needs.changes.outputs.backend == 'true'
        run: pnpm --filter @helvetly/api lint
      - run: pnpm lint:ui
      - run: pnpm typecheck
      - run: pnpm test:tooling

  static:
    # Preserve the existing check name for repositories that already require it.
    name: Format, lint, typecheck, build
    needs: [changes, quick]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - *pnpm
      - *node
      - &go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache: false # setup-go saves its cache once per go.sum; this one follows the code
      - &go-cache-restore
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *go-cache-config
      - &go-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *go-cache-config
      - *install
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helvetly-${{ github.sha }}
          path: apps/api/bin/helvetly
          retention-days: 7

  go:
    name: Go tests (${{ matrix.shard }})
    needs: [changes, quick]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    services:
      postgres: &postgres
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: helvetly
          POSTGRES_PASSWORD: helvetly
          POSTGRES_DB: helvetly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U helvetly -d helvetly"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Each Go test clones its own database from a migrated template (internal/store/storetest).
      HELVETLY_TEST_DATABASE_URL: postgres://helvetly:helvetly@localhost:5432/helvetly?sslmode=disable
      # The build cache is restored, so test results must not be: every test runs.
      GOFLAGS: -count=1
    defaults:
      run:
        working-directory: apps/api
    steps:
      - *checkout
      - *go
      - *go-cache-restore
      - *go-cache
      # `pnpm --filter @helvetly/api test` on every other package of `go list`, per shard.
      - run: |
          IFS=/ read -r shard shards <<< '${{ matrix.shard }}'
          go list ./... | awk -v s="$shard" -v n="$shards" 'NR % n == s % n' | xargs go test -race

  einvoice:
    name: XSD and KoSIT validation
    needs: [changes, quick]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: *postgres # the XSD tests build their invoices through the store
    env:
      GOFLAGS: -count=1
      HELVETLY_TEST_DATABASE_URL: postgres://helvetly:helvetly@localhost:5432/helvetly?sslmode=disable
    steps:
      - *checkout
      - *go
      - *go-cache-restore
      - *go-cache
      # xmllint validates the ESTV eCH-0217 and KSeF FA(3) exports against their pinned official schemas (pnpm test:xsd).
      # When the Ubuntu mirrors are unreachable, xmllint runs from an Alpine image with the same paths mounted.
      - run: |
          command -v xmllint && exit 0
          sudo timeout 240 sh -c 'apt-get update && apt-get install -y --no-install-recommends libxml2-utils' && exit 0
          printf 'FROM alpine:3.22\nRUN apk add --no-cache libxml2-utils\n' | docker build -q -t xmllint -
          sudo tee /usr/local/bin/xmllint >/dev/null <<'WRAPPER'
          #!/bin/sh
          exec docker run --rm -i -v /tmp:/tmp -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" xmllint xmllint "$@"
          WRAPPER
          sudo chmod +x /usr/local/bin/xmllint
          xmllint --version
      - name: Validate XSD exports
        working-directory: apps/api
        run: HELVETLY_TEST_XSD=1 go test -count=1 -run 'ECH0217|ReportXML|XMLExport|FA3' ./internal/vatreturn ./internal/einvoice
      # The validator jars and profiles, cached by the script's pinned digests. The script checks the SHA-256 of
      # cached bytes too, so the cache only saves the downloads (GitHub releases, Maven Central) and their outages.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/helvetly/einvoice-tools
          key: einvoice-tools-${{ hashFiles('scripts/validate-einvoice.sh') }}
      - run: bash scripts/validate-einvoice.sh
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kosit-reports
          path: ${{ runner.temp }}/helvetly/kosit.*/reports/
          retention-days: 7

  vitest:
    name: Unit and Storybook tests (${{ matrix.shard }})
    needs: [changes, quick]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/5', '2/5', '3/5', '4/5', '5/5']
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - &playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The browser alone (cached above): the runner image already has Chromium's system libraries.
      # `--with-deps` ran apt on every job and was ~38% of all CI minutes, often hanging on
      # slow Ubuntu mirrors. apt runs only if Chromium cannot start without it.
      - &playwright
        run: |
          pnpm --filter @helvetly/e2e exec playwright install chromium
          pnpm --filter @helvetly/e2e exec node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" ||
            timeout 240 pnpm --filter @helvetly/e2e exec playwright install-deps chromium
      # Each shard writes its results and coverage as a blob; the coverage job merges them into one report.
      - run: pnpm test:coverage --shard=${{ matrix.shard }} --reporter=default --reporter=blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ strategy.job-index }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage report
    needs: [changes, quick, vitest]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest/blob/
          merge-multiple: true
      - run: pnpm test:coverage --merge-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  storybook:
    name: Build Storybooks
    needs: [changes, quick]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none # history for the diff below
          persist-credentials: false
      - *pnpm
      - *node
      - *install
      - run: pnpm build:storybook
      # A PR's focus audit opens only the stories its changes reach. ready_for_review (like main, merge groups
      # and manual runs) audits every story, so whatever the module graph missed still turns up there.
      - if: github.event_name == 'pull_request' && github.event.action != 'ready_for_review'
        run: node scripts/visual-affected.mjs '${{ github.event.pull_request.base.sha }}' e2e/visual/affected.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-${{ github.sha }}
          path: |
            apps/platform/storybook-static
            apps/portal/storybook-static
            e2e/visual/affected.json
          if-no-files-found: error
          retention-days: 1

  visual:
    name: Visual regression (${{ matrix.shard }})
    needs: [changes, quick, storybook]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8'] # screenshots and the focus audit of every story
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-${{ github.sha }}
      - run: pnpm test:visual --shard=${{ matrix.shard }} # Playwright inside the pinned mcr.microsoft.com/playwright image
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-${{ github.sha }}-${{ strategy.job-index }}
          path: |
            e2e/visual/playwright-report
            e2e/visual/test-results
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.shard }})
    needs: [changes, quick]
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    env: # Postgres and S3 come from compose.e2e.yml, started by pnpm test:e2e
      HELVETLY_E2E_SHARD: ${{ matrix.shard }}
    steps:
      - *checkout
      - *pnpm
      - *node
      - *go
      - *go-cache-restore
      - *go-cache
      - *install
      - *playwright-cache
      - *playwright
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-evidence-${{ strategy.job-index }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  required:
    name: CI required
    needs: [changes, quick, static, go, einvoice, vitest, coverage, storybook, visual, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *checkout
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: node scripts/ci.mjs verify
