# Publishes the container image of a release: pushing a tag v<semver> that points at a commit of main, whose
# `CI required` check passed, builds the Dockerfile and pushes ghcr.io/helvetly/helvetly:<tag> with a build
# provenance attestation that ties the image digest to this repository, workflow, tag and commit. An existing tag is
# never overwritten. Nothing is deployed from here: an installation pulls a release by its tag and verifies it on its
# own side (README: Releases).
#
# Hand-off: once the image is published, a final release (no '-' in the tag) of Helvetly/helvetly sends a
# `helvetly-release` dispatch event with the tag and commit SHA to the repository in the variable
# DEPLOY_DISPATCH_REPO, using the secret DEPLOY_DISPATCH_TOKEN. Forks and prereleases skip it.
#
# CI still running when the tag arrives: the run fails at "Check CI"; re-run it once CI is green.
name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/helvetly/helvetly

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write # the attestation's storage record, linking the image to this repository
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (v<semver>)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG points at a commit that is not on main"; exit 1; }

      - name: Check CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20required" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion // "missing"')
          [ "$conclusion" = success ] || { echo "::error::CI required on $GITHUB_SHA is '$conclusion', not success"; exit 1; }

      - name: Sign in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Refuse overwriting a published tag
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists; release a new version instead"
            exit 1
          fi

      - name: Build and push
        id: push
        run: |
          docker buildx build --platform linux/amd64 --build-arg "VERSION=$TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$TAG" --metadata-file "$RUNNER_TEMP/meta.json" --push .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest (got '$digest')"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "Published \`$IMAGE:$TAG\` = \`$IMAGE@$digest\` from \`$GITHUB_SHA\`" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Sign out
        if: always()
        run: docker logout ghcr.io

  dispatch:
    name: Hand off to deployment
    needs: [image]
    if: github.repository == 'Helvetly/helvetly' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # calls another repository with DEPLOY_DISPATCH_TOKEN; GITHUB_TOKEN is not used
    steps:
      - name: Send the release to the deployment repository
        env:
          REPO: ${{ vars.DEPLOY_DISPATCH_REPO }}
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        # -f keeps both values strings (-F would turn an all-digit SHA into a number)
        run: |
          [ -n "$REPO" ] || { echo "::error::repository variable DEPLOY_DISPATCH_REPO is not set"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::error::secret DEPLOY_DISPATCH_TOKEN is not set"; exit 1; }
          gh api "repos/$REPO/dispatches" -f event_type=helvetly-release \
            -f "client_payload[tag]=$TAG" -f "client_payload[sha]=$GITHUB_SHA"
