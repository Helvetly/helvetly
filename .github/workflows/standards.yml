name: Standards watch

# Weekly: opens an issue when a pinned standard (KoSIT, XRechnung, Peppol BIS, SIX QR-bill IG) has a newer
# release. It never changes code: adopting a version is a deliberate pull request, once the authority accepts it.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # actions/checkout runs `git init`; a default branch name keeps git's "Using 'master'" hint out of the log.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the issues token is used by gh only, never left in .git/config

      - name: Find newer versions
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/standards.sh > outdated.tsv
          cat outdated.tsv

      - name: Open one issue per new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r name pinned latest url; do
            title="Standard update: $name $latest is out (pinned $pinned)"
            # an issue for this version, open or closed, means it was already seen
            if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              continue
            fi
            gh issue create --title "$title" --body "$(printf '%s\n' \
              "**$name** has a newer release: \`$latest\` (we pin \`$pinned\`)." "" \
              "Release notes: $url" "" \
              "Before adopting it:" \
              "- Check from when the authority (KoSIT, SIX, OpenPeppol, ESTV) accepts or requires it; until then keep the pin." \
              "- Update the pin and its SHA-256 where it is used, adapt the code, and let \`pnpm check\` validate it." \
              "" "Opened by the weekly Standards watch workflow.")"
          done < outdated.tsv
