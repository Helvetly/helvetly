name: Cancel closed pull request runs

on:
  pull_request:
    types: [closed]

permissions: {}

# Join CI's group for this PR. GitHub cancels the superseded run even for forks,
# without a write token or matching other pull requests with the same head SHA.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'Pull request closed.'
