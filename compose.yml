# Local development dependencies. The apps themselves run on the host via `pnpm dev`.
# Values come from the root `.env` (copy `.env.example`), which Compose loads automatically.
name: helvetly

services:
  db:
    image: postgres:18.6-alpine
    # Parallel Go tests each open their own small pools (internal/store/storetest); 100 is too few.
    command: ['postgres', '-c', 'max_connections=400']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helvetly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helvetly}
      POSTGRES_DB: ${POSTGRES_DB:-helvetly}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: maxiofs/maxiofs:1.8.0
    environment:
      MAXIOFS_BOOTSTRAP_ACCESS_KEY: ${S3_ACCESS_KEY:-helvetly}
      MAXIOFS_BOOTSTRAP_SECRET_KEY: ${S3_SECRET_KEY:-helvetly-secret}
    ports:
      - '127.0.0.1:${S3_PORT:-9300}:8080' # S3 API
      - '127.0.0.1:${S3_CONSOLE_PORT:-9301}:8081' # web console (admin / admin)
    volumes:
      - s3-data:/data

  # One-shot: creates the application bucket once MaxIOFS answers.
  s3-init:
    image: amazon/aws-cli:2.39.4
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-helvetly}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-helvetly-secret}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${S3_BUCKET:-helvetly}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until aws --endpoint-url http://s3:8080 s3 ls >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://s3:8080 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://s3:8080 s3 mb "s3://$$BUCKET"
    restart: 'no'

  # Forwards Stripe test-mode webhooks to the API running on the host.
  # Exits at once when STRIPE_SECRET_KEY is empty; the rest of the stack is unaffected.
  stripe:
    image: stripe/stripe-cli:v1.55.8
    command:
      - listen
      - --all-snapshot
      - --skip-update
      - --api-key=${STRIPE_SECRET_KEY:-}
      - --forward-to=host.docker.internal:${API_PORT:-3333}/api/webhooks/stripe
      # The API answers 404 to a host it does not know; send its own.
      - '--headers=Host: localhost:${API_PORT:-3333}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: 'no'

  # Catches every email the API sends; read them in the web UI.
  mail:
    image: axllent/mailpit:v1.33.0
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025' # SMTP
      - '127.0.0.1:${MAIL_UI_PORT:-8026}:8025' # web UI
    volumes:
      - mail-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  mail-data:
  db-data:
  s3-data:
